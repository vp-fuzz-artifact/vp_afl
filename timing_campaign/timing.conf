# ------------------------------------------------------------------- timing
# Config for the timing campaign.  Self-contained on purpose: it does not
# source campaign/campaign.conf, so changing one campaign cannot disturb the
# other.  Override any path from the environment:
#   BENCH_ROOT=... RESULTS_ROOT=... ./run_timing.sh
HERE="${HERE:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
VP_AFL_ROOT="$(cd "$HERE/.." && pwd)"
BENCH_ROOT="${BENCH_ROOT:-$(cd "$VP_AFL_ROOT/.." && pwd)/vp_sw_benchmarks/cortex-A72}"
RESULTS_ROOT="${RESULTS_ROOT:-$VP_AFL_ROOT/timing_results}"

# The DEBUG=1 harness lives in its own image so the fuzzing image is untouched.
#   podman build -t vp-afl-timing -f timing_campaign/Dockerfile.timing .
IMAGE_NAME="${IMAGE_NAME:-vp-afl-timing}"

# platform:benchmark-name, same cells as the fuzzing campaign
CELLS=(
  "baremetal:arch_pro"  "baremetal:zlib_baremetal"  "baremetal:crypto_baremetal"
  "Linux:arch_pro"      "Linux:zlib"                "Linux:crypto"
  "zephyr:arch_pro"     "zephyr:zlib"               "zephyr:crypto"
)
MODES=(0 1 2)          # 0 none, 1 CRIU, 2 fork
ROUNDS=5               # repetitions; the harness does 10 iterations per run,
                       # so 5 rounds = 50 Tbody and 45 Trestore samples per cell

# ------------------------------------------------------------------- input
# One fixed input for every run of a cell: we are measuring checkpointing, not
# input sensitivity, so Tbody must be the same workload everywhere.  Relative
# to the benchmark dir.  "seeds/seed_0" is resolved through symlinks, as the
# fuzzing campaign does.
TIMING_INPUT="${TIMING_INPUT:-seeds/seed_0}"

# ------------------------------------------------------------------- stopping
# A timing run is bounded work (10 iterations), not an open-ended fuzz run, so
# these are watchdogs for a hung VP rather than a stopping rule.
MAX_SECONDS=1800
MAX_SECONDS_Linux=7200

# How many times the harness binary is invoked per scheduled run.  Each
# invocation gives 1 Tstart + 10 Tbody + 9 Trestore samples.  Keep this at 1
# for mode 1: a dump run would re-dump on every repeat.
REPEATS_PER_RUN=1

# Iterations the DEBUG harness does per invocation.  Hardcoded in
# harness.cpp:292; set here only so the parser can warn on a mismatch.
HARNESS_ITERS=10

# ------------------------------------------------------------------- ordering
ORDER_SEED=20261013

# ------------------------------------------------------------------- parallel
# Latency, not throughput: a co-tenant run inflates every interval measured
# here.  WORKERS>1 is supported (see README), but pin the workers if you use it
# and never overlap this with the fuzzing campaign.
WORKERS=1
# One cpuset per worker, as in the fuzzing campaign.  Generate with
#   ../campaign/gen_cpusets.sh <workers> 2
# Empty => no pinning.
WORKER_CPUSETS=()

# Container working directory.  settings.bash waits for the CRIU service socket
# at $PRJ_ROOT_DIR/criu_service.socket, but startcriusocket.sh creates it in
# $(pwd) -- so cwd must be /app or the 20 s wait silently times out.  The
# fuzzing campaign uses -w /app/vp_mode/aflplusplus, where the socket lands in
# the wrong place; see README.
CONTAINER_WORKDIR="${CONTAINER_WORKDIR:-/app}"

COOLDOWN=10        # let the machine settle between two runs of a worker
MIN_FREE_MB=2000   # refuse to start a run below this free disk
