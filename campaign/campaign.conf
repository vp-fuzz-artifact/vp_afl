# ------------------------------------------------------------------ campaign
# Paths follow this checkout. Override either of them from the environment:
#   BENCH_ROOT=/data/vp_sw_benchmark/cortex-A72 RESULTS_ROOT=/data/results \
#       ./run_campaign.sh
HERE="${HERE:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
VP_AFL_ROOT="$(cd "$HERE/.." && pwd)"
BENCH_ROOT="${BENCH_ROOT:-$(cd "$VP_AFL_ROOT/.." && pwd)/vp_sw_benchmarks/cortex-A72}"
RESULTS_ROOT="${RESULTS_ROOT:-$VP_AFL_ROOT/campaign_results}"
IMAGE_NAME="${IMAGE_NAME:-vp-afl}"

# platform:benchmark-name (the names differ per platform)
CELLS=(
  "baremetal:arch_pro"  "baremetal:zlib_baremetal"  "baremetal:crypto_baremetal"
  "Linux:arch_pro"      "Linux:zlib"                "Linux:crypto"
  "zephyr:arch_pro"     "zephyr:zlib"               "zephyr:crypto"
)
MODES=(0 1 2)          # 0 none, 1 CRIU, 2 fork
ROUNDS=5

# ------------------------------------------------------------------ stopping
# a run ends when AFL found no new coverage for NOFIND_<platform> seconds,
# or after MAX_SECONDS, whichever comes first
NOFIND_baremetal=1800
NOFIND_zephyr=1800
NOFIND_Linux=3600
MAX_SECONDS=43200                 # 12 h hard cap
# optional per-platform cap, overrides MAX_SECONDS for that platform:
# MAX_SECONDS_Linux=86400

# AFL per-exec timeout (-t), as in your run_fuzzer.bash
AFL_T_baremetal=20000
AFL_T_Linux=300000
AFL_T_zephyr=20000

# ------------------------------------------------------------------ ordering
# Seed of the random run order. Same number => same order again, so the
# campaign can be re-run or verified later. It is only an RNG seed and it is
# written into schedule.tsv.
ORDER_SEED=20261009

# AFL RNG seed (afl-fuzz -s). One seed per round, shared by all 27 runs of that
# round: inside a round the modes of a target mutate identically, so a
# difference between two modes is not seed luck, while the rounds use different
# streams, so the spread over the 5 rounds of a cell is a real trial-to-trial
# spread instead of the nondeterminism of a single mutation stream.
# Round r uses AFL_SEED_BASE + (r - 1); the seed of every run is written to
# schedule.tsv, to its meta.txt and to runs.csv. AFL_SEED_PER_ROUND=0 pins all
# rounds to AFL_SEED_BASE again (how the campaign ran before).
# -s stays set either way, and not only for reproducibility: a fixed seed also
# pins havoc_div, which AFL otherwise picks from exec speed - the faster
# checkpoint mode would get a different mutation budget per input.
AFL_SEED_BASE=42
AFL_SEED_PER_ROUND=1

# ------------------------------------------------------------------ parallel
# How many containers run at the same time.
WORKERS=12
# One cpuset per worker, so a run always gets the same cores and two runs never
# share a physical core.  Generate the list on the campaign machine with
#   ./gen_cpusets.sh 12 2        # 12 workers, 2 physical cores each
# and paste the result here.  Empty => no pinning (exec/s then varies with load).
WORKER_CPUSETS=()

COOLDOWN=60        # idle seconds between two runs of the same worker
MIN_FREE_MB=10000  # refuse to start a run below this free disk
